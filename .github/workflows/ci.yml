name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install CPU-only PyTorch + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2 torchvision==0.17.2
          pip install "numpy<2" Pillow scikit-learn matplotlib requests tqdm pytest ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run fast unit tests
        run: pytest tests/ -v
